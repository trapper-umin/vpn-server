services:
  consul:
    image: hashicorp/consul:latest
    container_name: consul-server-v2
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - server-vpn

  postgres-auth:
    image: postgres:latest
    container_name: auth-service-db1
    hostname: postgres-auth
    restart: always
    environment:
      POSTGRES_DB: auth-service
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 9qwe1ox
    ports:
      - "5433:5432"
    networks:
      - server-vpn

networks:
  server-vpn:
    driver: bridge