server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: 8500
      discovery:
        enabled: true
        register: true
        prefer-ip-address: true
        ip-address: ${SPRING_CLOUD_CONSUL_HOST_DISCOVERY_IP_ADDRESS:host.docker.internal}
      config:
        enabled: true
        format: YAML

  config:
    import: "optional:consul:"

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

# Service URLs Configuration
services:
  user-management:
    url: ${USER_MANAGEMENT_SERVICE_URL:http://localhost:8081}

# JWT Configuration (должен совпадать с user-management-service)
jwt:
  secret: ${JWT_SECRET:myVerySecretJWTKeyForVPNProject2024!@#$%^&*()_+}

# Logging Configuration
logging:
  level:
    server.vpn.com.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.web.cors: DEBUG