spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  liquibase:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: false

jwt:
  secret: testSecretKeyForJWTTokenSigningThisShouldBe256BitsLong
  expiration: 604800000

logging:
  level:
    server.vpn.com.auth: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: DEBUG 