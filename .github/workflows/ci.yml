name: CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [17]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
          
      - name: Make mvnw executable
        run: chmod +x ./mvnw
        
      - name: Run tests
        run: ./mvnw clean test
        
      - name: Build project
        run: ./mvnw clean compile
        
      - name: Package applications
        run: ./mvnw clean package -DskipTests
        
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.java-version }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts-${{ matrix.java-version }}
          path: |
            **/target/*.jar
            !**/target/*-sources.jar
            !**/target/*-javadoc.jar

  code-quality:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
          
      - name: Make mvnw executable
        run: chmod +x ./mvnw
        
      - name: Run SpotBugs
        run: ./mvnw clean compile spotbugs:check
        continue-on-error: true
        
      - name: Run PMD
        run: ./mvnw clean compile pmd:check
        continue-on-error: true
        
      - name: Run Checkstyle
        run: ./mvnw clean compile checkstyle:check
        continue-on-error: true
        
      - name: Upload SpotBugs reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: spotbugs-reports
          path: |
            **/target/spotbugs*.xml
            **/target/site/spotbugs.html
            
      - name: Upload PMD reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: pmd-reports
          path: |
            **/target/pmd.xml
            **/target/site/pmd.html
            
      - name: Upload Checkstyle reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: checkstyle-reports
          path: |
            **/target/checkstyle-result.xml
            **/target/site/checkstyle.html

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
          
      - name: Make mvnw executable
        run: chmod +x ./mvnw
        
      - name: Run OWASP Dependency Check
        run: ./mvnw clean compile org.owasp:dependency-check-maven:check
        continue-on-error: true
        
      - name: Upload dependency check reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dependency-check-reports
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.xml
