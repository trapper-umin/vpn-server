name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  release:
    name: Create Release Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
          
      - name: Make mvnw executable
        run: chmod +x ./mvnw
        
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: Set version in pom.xml
        run: ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.VERSION }}
        
      - name: Run tests
        run: ./mvnw clean test
        
      - name: Build and package
        run: ./mvnw clean package -DskipTests
        
      - name: Create release artifacts directory
        run: mkdir -p release-artifacts
        
      - name: Copy artifacts
        run: |
          find . -name "*.jar" -not -path "*/target/original-*" -not -name "*-sources.jar" -not -name "*-javadoc.jar" -exec cp {} release-artifacts/ \;
          ls -la release-artifacts/
        
      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: release-artifacts/
          asset_name: vpn-server-${{ steps.version.outputs.VERSION }}.zip
          asset_content_type: application/zip

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'release'
    
    strategy:
      matrix:
        service: [api-gateway-service, user-management-service, vpn-management-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vpn-${{ matrix.service }}:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/vpn-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
